# What this file proves: `loop` is a plugin, not a kernel feature.
# The kernel contains no control flow at all — the plugin calls back into
# the executor through ctx.runSteps() with its own child variable scope.
name: nested steps run in a child scope

steps:
  - id: seed
    type: loop
    over: [1, 2, 3]
    as: postId
    steps:
      - id: fetched
        type: http
        method: GET
        url: /posts/${postId}

  - id: after
    type: http
    method: GET
    url: /posts/${seed.iterations}

assert:
  - type: status
    expected: 200
  - type: jsonpath
    path: id
    expected: 3

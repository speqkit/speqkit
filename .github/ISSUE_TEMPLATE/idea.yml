name: An idea for the kernel or an in-box plugin
description: Something that has to live here rather than in a plugin of your own.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        If it could be a plugin, it should be — you can publish one today and it
        will be a first-class citizen, not an add-on. See
        [CONTRIBUTING](https://github.com/speqkit/speqkit/blob/main/CONTRIBUTING.md#most-contributions-do-not-belong-in-this-repository).
        This form is for the rest: the kernel, the installer, the binary, the
        CLI, and the plugins under `packages/`.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What you were doing when you wanted this, and what you did instead.
        A suite that had to be written awkwardly is worth more here than a
        feature description.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: textarea
    id: why-here
    attributes:
      label: Why it cannot be a plugin
      description: >-
        The honest answer is sometimes "I am not sure", and that is fine — say
        so and we will work it out.
    validations:
      required: true

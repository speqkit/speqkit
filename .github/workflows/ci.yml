name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this same file as its gate. Not a copy of these
  # steps and not a `workflow_run` that watches from outside: the thing that
  # decides whether a commit ships has to be the identical battery a pull
  # request faces, or the two drift and the release one is the one nobody
  # reads until it is too late.
  workflow_call:

# A second push to the same branch cancels the first: nobody reads the CI of a
# commit that has already been replaced. `github.workflow` is in the key
# because when release.yml calls this file the group is evaluated in *its*
# context — without it, the gate of a release and the ordinary CI of the same
# commit would land in one group and cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor stated in every package's `engines`, and current. A test
        # framework that only runs on the maintainer's Node is not one.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v7

      # No `version:` — it reads `packageManager` from the root package.json,
      # so the pinned pnpm lives in one place instead of two that can drift.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      # The one that matters. Everything above resolves `speqkit` and
      # `@speqkit/*` through a bundler alias to `src`; this packs the real
      # tarballs, serves them from a throwaway registry and runs the CLI out
      # of `dist` with plain node, in a directory with no node_modules. It is
      # the only step here that tests what a stranger would actually install.
      - run: node scripts/verify-publish.mjs

  # The one path every newcomer takes, and until now the one path nothing ran.
  # `examples/basic` had been red for weeks — `jsonpath` moved into
  # plugin-assert and the example's plugin list was never updated — which
  # nobody saw, because the README is where it is described and the gate is
  # where it is not.
  #
  # It runs against a stub on localhost rather than jsonplaceholder: a gate
  # that goes over the public internet reports somebody else's outage as our
  # broken example. The `ci` environment already reads ${env:API_URL}, so this
  # changes nothing a reader of the example has to know.
  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/basic
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build
        working-directory: .

      # The binary out of dist, with plain node — what the README tells a
      # stranger to type, not a tsx loader we happen to have configured.
      - run: ./node_modules/.bin/speq plugins
      - run: ./node_modules/.bin/speq validate

      # The grammar, out of the real binary. It is the one surface whose
      # content is entirely somebody else's — every line of it comes from a
      # plugin — so a schema that stopped being reachable would show up here
      # and nowhere else in this job.
      - run: ./node_modules/.bin/speq capabilities

      # The example's own broken file, which is there to be caught. A green
      # exit here would mean validation had stopped checking anything.
      - name: the typo is still caught
        run: |
          if ./node_modules/.bin/speq validate --suite broken; then
            echo "broken/typo.yaml validated clean — validation is not checking" >&2
            exit 1
          fi

      # The same refusal, read the way a repair loop reads it. The unit tests
      # own the shape; what this owns is that the shape survives the build, the
      # bin shim and a real project — and that the code, not the sentence, is
      # what a caller matches on.
      - name: and a program can read that refusal
        run: |
          if ./node_modules/.bin/speq validate --suite broken --json > diagnostics.json; then
            echo "broken/typo.yaml validated clean — validation is not checking" >&2
            exit 1
          fi
          grep -q '"code": "unknown-step-type"' diagnostics.json
          rm diagnostics.json

      - name: the suites run
        run: |
          node ../../scripts/example-api.mjs -- \
            ./node_modules/.bin/speq run --env ci --test suites/health.yaml
          node ../../scripts/example-api.mjs -- \
            ./node_modules/.bin/speq run --env ci --test suites/loop.yaml

  # `@speqkit/plugin-playwright` is half the architecture gate — the proof that
  # a scoped resource and a binary artifact work from outside the kernel — and
  # its tests need a browser, which the matrix above deliberately does not
  # have: `playwright` is an optional peer, and a Go service running HTTP smoke
  # checks should not download 300MB because this package exists.
  #
  # So they skip when no browser is installed, and this job is the one place
  # that is not allowed. SPEQ_REQUIRE_BROWSER=1 turns the skip into a failure,
  # because otherwise "green" and "did not run" look identical from outside.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec vitest run packages/plugin-playwright
        env:
          SPEQ_REQUIRE_BROWSER: '1'

  # The binary is a second way of shipping the same kernel, and it breaks in
  # ways the packages cannot: a bundler rewriting `import()` would leave every
  # plugin unloadable while `pnpm test` stayed green. One platform is enough
  # here — the release workflow builds all four — but it has to be *some*
  # platform, on every push, or the first person to notice is whoever tags.
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Downloads the pinned runtime from nodejs.org, checks it against
      # SHASUMS256.txt, and smoke-tests the result with PATH emptied.
      - run: node scripts/build-binary.mjs

      # The same battery the packages face, pointed at the executable: install
      # from a throwaway registry, load every plugin out of the store, run a
      # suite — with no Node on PATH at all.
      - run: node scripts/verify-publish.mjs --binary build/speq

      # Proves the `curl … | sh` path against the artefacts just built, so it
      # cannot be discovered broken by the first stranger who runs it.
      - name: install.sh installs what was built
        run: |
          SPEQKIT_BASE_URL="file://$PWD/build" sh packaging/install.sh \
            --version "v$(node -p "require('./packages/core/package.json').version")" \
            --bin-dir "$RUNNER_TEMP/bin"
          env -i PATH="" "$RUNNER_TEMP/bin/speq" version
